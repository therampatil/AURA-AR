services:
  - type: web
    name: aura-webar-server
    env: node
    plan: free
    region: oregon
    rootDir: webar_portal
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
    disk:
      name: aura-3d-storage
      mountPath: /app/public/models
      sizeGB: 1
